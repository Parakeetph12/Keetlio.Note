<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/vZDvN61b/Logopit-1600638333146.png">

</head>
<body>
    <nav>
        <a href="index.html">Início</a>

    <header>
        <h1>Diário</h1>
        <p>Escreva suas anotações que você deseja manter.</p>
    </header>

    <div style="display: flex; gap: 10px; justify-content: center;">
        <button onclick="abrirConfiguracoes()" title="Configurações">Configurações</button>
        <button onclick="logout()">Sair</button>
        <button onclick="exportarDados()">Exportar Dados</button>
        <button onclick="importarDados()">Importar Dados</button>
        <input type="file" id="import-file" style="display: none;">
    </div>

    <div class="fixed-section">
        <h3>Minhas Anotações</h3>

<input type="text" id="diario-titulo" placeholder="Título da anotação">

<textarea id="diario-texto" placeholder="Escreva sua anotação aqui!"></textarea>
<button onclick="salvarAnotacao()">Salvar Anotação</button>
        <ul id="lista-anotacoes"></ul>
    </div>
</body>
