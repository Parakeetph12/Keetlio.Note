<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Codex</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/vZDvN61b/Logopit-1600638333146.png">
    <script src="script.js" defer></script>
</head>
<body>
    <nav>
        <a href="index.html">Início</a>
        <a href="pagina2.html">Quadro Branco</a>
        <a href="pagina3.html">Diário</a>
        <a href="pagina4.html">Contato</a>
        <a href="pagina5.html">Atualizações</a>
    </nav>
    <header>
        <h1>Meu Codex</h1>
        <p>Meu local de organização</p>
        <p id="pontos">Pontos: 0</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button onclick="abrirConfiguracoes()" title="Configurações">Configurações</button>
            <button onclick="logout()">Sair</button>
        </div>
    </header>

<button onclick="exportarDados()" class="export-btn">Exportar Dados</button>
<button onclick="importarDados()" class="import-btn">Importar Dados</button>
<input type="file" id="import-file" style="display: none;">

    <div class="main-sections">
        <div class="fixed-section">
            <h3>Tarefas Diárias</h3>
            <ul id="tarefas-diarias"></ul>
            <div class="button-group">
                <button onclick="openAddModal('tarefasDiarias')">Adicionar Tarefa Diária</button>
                <button onclick="mostrarGerenciarTarefas()">Gerenciar Tarefas Diárias</button>
            </div>
            <div id="gerenciar-tarefas" style="display: none;">
                <h4>Remover Tarefas Diárias</h4>
                <ul id="lista-tarefas-gerenciar"></ul>
            </div>
        </div>
        <div class="fixed-section">
            <h3>Minhas Notas</h3>
            <ul id="lista-notas"></ul>
            <button onclick="openAddModal('notas')">Adicionar Nota</button>
        </div>
        <div class="fixed-section">
            <h3>Tarefas Adicionais</h3>
            <ul id="lista-tarefas-adicionais"></ul>
            <button onclick="openAddModal('tarefasAdicionais')">Adicionar Tarefa</button>
        </div>
        <div class="fixed-section">
            <h3>Links Importantes</h3>
            <ul id="lista-links"></ul>
            <button onclick="openAddModal('links')">Adicionar Link</button>
        </div>
    </div>
    <div class="drawer-container">
        <div class="drawer-header" onclick="toggleDrawer()">
            <h2>Calendário</h2>
            <span id="drawer-arrow">▼</span>
        </div>
        <div id="drawer-content" class="drawer-content">
            <div id="calendar-controls" class="drawer-controls">
                <div class="drawer-control-group">
                    <button onclick="previousMonth()">Mês Anterior</button>
                    <span id="calendar-month-year"></span>
                    <button onclick="nextMonth()">Próximo Mês</button>
                </div>
                <div class="drawer-control-group">
                    <label for="largura-tela">Largura:</label>
                    <input type="number" id="largura-tela" value="800" min="300" max="2000">
                </div>
                <div class="drawer-control-group">
                    <label for="altura-tela">Altura:</label>
                    <input type="number" id="altura-tela" value="500" min="200" max="1000">
                </div>
                <div class="drawer-buttons">
                    <button onclick="ajustarTamanhoTela()">Redimensionar</button>
                </div>
            </div>
            <div id="calendar" class="calendar"></div>
        </div>
    </div>
</body>
</html>
