<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Keetlio.Note</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/vZDvN61b/Logopit-1600638333146.png">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="login-container">
        <h2>Login</h2>
        <div id="login-form">
            <h3>Usuários cadastrados:</h3>
            <ul id="user-list"></ul>
            <label for="username">Usuário:</label>
            <input type="text" id="username" placeholder="Digite seu usuário">
            <label for="password">Senha:</label>
            <input type="password" id="password" placeholder="Digite sua senha">
            <button onclick="login()">Entrar</button>
            <p id="login-error">Usuário ou senha incorretos.</p>
            <div id="new-user-section">
                <h3>Cadastrar novo usuário:</h3>
                <input type="text" id="new-username" placeholder="Novo usuário">
                <input type="password" id="new-password" placeholder="Nova senha">
                <button onclick="registerUser()">Cadastrar</button>
                <p id="register-error"></p>
                <p id="register-success">Usuário cadastrado com sucesso! Faça login para continuar.</p>
            </div>
        </div>
    </div>
</body>
</html>
